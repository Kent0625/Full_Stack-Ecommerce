# Render Blueprint for Archive Thrift
# Note: For a permanent portfolio deployment, connect a free Neon (neon.tech) or Supabase PostgreSQL
# database so your database NEVER expires after 30/90 days like Render's ephemeral free database!

services:
  - type: web
    name: archive-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set to your free Neon / PostgreSQL connection string
      - key: REPORTING_DATABASE_URL
        sync: false # Set to your reporting DB connection string or same Neon instance
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRES_SECONDS
        value: 86400
      - key: FRONTEND_URL
        sync: false # e.g. https://your-portfolio.vercel.app or your custom domain

  - type: web
    name: archive-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: BACKEND_URL
        fromService:
          name: archive-backend
          type: web
          property: host
      - key: NEXT_PUBLIC_API_URL
        value: /api
